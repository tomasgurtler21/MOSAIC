schema_version: "1"
id: subagent-logger
version: 1.0.0
description: >-
  Captures subagent dispatch events and LLM call metadata for local logging
  and analysis. Hook scripts are placeholder-only; see placeholder note below.

# placeholder: true signals that variant file content has not yet been authored.
# The deployment tool treats this bundle as structurally valid but marks all
# deployed hook files as pending authoring in the TODO checklist.
# No functional hook ships as part of this project; sourcing or authoring the
# actual scripts is follow-up work.
placeholder: true

variants:
  claude-code:
    supported: true
    files:
      - source: subagent-logger.ps1
        target: subagent-logger.ps1
      - source: config.json
        target: subagent-logger.json
    registration:
      - id: settings-fragment
        target_path: .claude/settings.json
        performable: true
        instruction: >-
          Merge the hooks fragment into .claude/settings.json to register the
          subagent-logger script as a SubagentStop hook.
        fragment: |
          {
            "hooks": {
              "SubagentStop": [
                {
                  "type": "command",
                  "command": ".claude/hooks/subagent-logger.ps1"
                }
              ]
            }
          }

  opencode:
    supported: true
    files:
      - source: plugin.ts
        target: subagent-logger.ts
    registration: []

  vscode-ghcp:
    supported: true
    # reuses declares that this variant adopts the file set of the named variant
    # rather than carrying its own files. The catalog resolves the actual file
    # list from the referenced variant; no files are duplicated on disk.
    reuses: claude-code
    registration:
      - id: settings-fragment
        target_path: .claude/settings.json
        performable: true
        instruction: >-
          Merge the hooks fragment into .claude/settings.json to register the
          subagent-logger script as a SubagentStop hook (same fragment as
          claude-code).
        fragment: |
          {
            "hooks": {
              "SubagentStop": [
                {
                  "type": "command",
                  "command": ".claude/hooks/subagent-logger.ps1"
                }
              ]
            }
          }
      - id: enable-chat-hooks
        target_path: ""
        performable: false
        instruction: >-
          Enable hooks in VS Code: open User Settings (JSON) and set
          "chat.hooks.enabled": true. This is a user-level editor setting
          and cannot be set by the deployment tool.

  ghcp-cli:
    supported: false
