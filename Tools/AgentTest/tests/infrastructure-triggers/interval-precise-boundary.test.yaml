schema_version: 1
name: interval-precise-boundary
id: 60
version: 1
changelog:
  - version: 1
    date: "2026-01-01"
    changes: "Initial."
description: >
  I-2 (precise): INVOCATION_INTERVAL trigger fires exactly at threshold.
  With interval=10 and global_sequence=9, the next workflow invocation
  (implementation-tdd, seq 10) hits 10-0=10 >= 10 exactly. The review
  agent must fire immediately after that invocation.
layer: orchestrator
negative: false

subject:
  identity: orchestrator
  agent: orchestrator
  workflows: [brownfield-tdd]
  infrastructure_agents: [orchestration-review-interval-10]
  opening_message: |
    Continue the existing workflow run. Read the Orchestration.md in the
    run-scoped folder and resume from where it left off. Do not ask me any
    further questions - proceed immediately and autonomously.
  invocation_kind: orchestrator
  allowed_tools: [Task, Read, Write, Edit, Bash, Glob, Grep]

stub_registry: interval-precise-boundary.stubs.json

timeout: 10m
turn_limit: 10
stop_after_invocations: 2

seed_files:
  - path: Orchestration-{run_id}/Orchestration.md
    ref: stage1-tests-done.md
  - path: Orchestration-{run_id}/Plan.md
    ref: Plan.md
  - path: Orchestration-{run_id}/Research.md
    ref: Research.md
  - path: Orchestration-{run_id}/Requirements.md
    ref: Requirements.md
  - path: Orchestration-{run_id}/ContractsDesign.md
    ref: ContractsDesign.md
  - path: Orchestration-{run_id}/Stage-1/Plan.md
    ref: Stage-1-Plan.md
  - path: Orchestration-{run_id}/Stage-1/PlanProgress.md
    ref: Stage-1-PlanProgress.md
  - path: Orchestration-{run_id}/Stage-2/Plan.md
    ref: Stage-2-Plan.md
  - path: Orchestration-{run_id}/Stage-2/PlanProgress.md
    ref: Stage-2-PlanProgress.md

assertions:
  invocation_sequence:
    exact: true
    steps:
      - { tool: dispatch, agent: implementation-tdd }
      - { tool: dispatch, agent: orchestration-review-interval-10 }
