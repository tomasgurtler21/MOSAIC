schema_version: 1
id: restore-class-exclusion
description: >
  I-6: Restore-class agents never fire automatically. restore-stage-end
  declares STAGE_END trigger and is restore class. After implementation-review
  completes stage 1 (STAGE_END condition met), the restore agent must NOT
  be dispatched — the next dispatch must be the stage 2 workflow agent.
layer: orchestrator
negative: false

subject:
  identity: orchestrator
  agent: orchestrator
  workflows: [brownfield-tdd]
  infrastructure_agents: [restore-stage-end]
  opening_message: |
    Continue the existing workflow run. Read the Orchestration.md in the
    run-scoped folder and resume from where it left off. Do not ask me any
    further questions - proceed immediately and autonomously.
  invocation_kind: orchestrator
  allowed_tools: [Task, Read, Write, Edit, Bash, Glob, Grep]

stub_registry: restore-class-exclusion.stubs.json

timeout: 10m
turn_limit: 30
stop_after_invocations: 2

seed_files:
  - path: Orchestration-{run_id}/Orchestration.md
    ref: stage1-impl-done-disabled.md
  - path: Orchestration-{run_id}/Plan.md
    ref: Plan.md
  - path: Orchestration-{run_id}/Research.md
    ref: Research.md
  - path: Orchestration-{run_id}/Requirements.md
    ref: Requirements.md
  - path: Orchestration-{run_id}/ContractsDesign.md
    ref: ContractsDesign.md
  - path: Orchestration-{run_id}/Stage-1/Plan.md
    ref: Stage-1-Plan.md
  - path: Orchestration-{run_id}/Stage-1/PlanProgress.md
    ref: Stage-1-PlanProgress.md
  - path: Orchestration-{run_id}/Stage-2/Plan.md
    ref: Stage-2-Plan.md
  - path: Orchestration-{run_id}/Stage-2/PlanProgress.md
    ref: Stage-2-PlanProgress.md

assertions:
  invocation_sequence:
    exact: true
    steps:
      - { tool: dispatch, agent: implementation-review }
      - { tool: dispatch, agent: test-writer-tdd }
