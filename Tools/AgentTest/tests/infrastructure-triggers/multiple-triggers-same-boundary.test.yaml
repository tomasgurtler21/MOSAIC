schema_version: 1
id: multiple-triggers-same-boundary
description: >
  I-3: Multiple infrastructure agents fire on the same stage boundary.
  Both checkpoint-stage-end-only and commit-manager-git declare STAGE_END.
  After implementation-review completes stage 1, BOTH must be dispatched
  in declaration order (checkpoint first, then commit), each with its own
  sequence number.
layer: orchestrator
negative: false

subject:
  identity: orchestrator
  agent: orchestrator
  workflows: [brownfield-tdd]
  infrastructure_agents: [checkpoint-stage-end-only, commit-manager-git]
  opening_message: |
    Continue the existing workflow run. Read the Orchestration.md in the
    run-scoped folder and resume from where it left off. Do not ask me any
    further questions - proceed immediately and autonomously.
  invocation_kind: orchestrator
  allowed_tools: [Task, Read, Write, Edit, Bash, Glob, Grep]

stub_registry: multiple-triggers-same-boundary.stubs.json

timeout: 10m
turn_limit: 30
stop_after_invocations: 3

seed_files:
  - path: Orchestration-{run_id}/Orchestration.md
    ref: stage1-impl-done-both-enabled.md
  - path: Orchestration-{run_id}/Plan.md
    ref: Plan.md
  - path: Orchestration-{run_id}/Research.md
    ref: Research.md
  - path: Orchestration-{run_id}/Requirements.md
    ref: Requirements.md
  - path: Orchestration-{run_id}/ContractsDesign.md
    ref: ContractsDesign.md
  - path: Orchestration-{run_id}/Stage-1/Plan.md
    ref: Stage-1-Plan.md
  - path: Orchestration-{run_id}/Stage-1/PlanProgress.md
    ref: Stage-1-PlanProgress.md
  - path: Orchestration-{run_id}/Stage-2/Plan.md
    ref: Stage-2-Plan.md
  - path: Orchestration-{run_id}/Stage-2/PlanProgress.md
    ref: Stage-2-PlanProgress.md

assertions:
  invocation_sequence:
    exact: true
    steps:
      - { tool: dispatch, agent: implementation-review }
      - { tool: dispatch, agent: checkpoint-stage-end-only }
      - { tool: dispatch, agent: commit-manager-git }
