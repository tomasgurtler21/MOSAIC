schema_version: 1
id: wildcard-expansion
description: >
  Wildcard and artifact path resolution. Tests that the orchestrator correctly
  expands Stage-*/Plan.md and similar wildcards in workflow table Input/Output
  columns to all matching files.
defaults:
  timeout: 10m
  turn_limit: 5
  repetitions: 100
  pass_rate: 0.95
  echo_fidelity: advisory
tests:
  - path: wildcard-input-expansion.test.yaml
  - path: wildcard-dual-expansion.test.yaml
  - path: wildcard-after-routeback.test.yaml
