schema_version: 1
name: hitl-plan-stage-all-agents
id: 55
version: 1
changelog:
  - version: 1
    date: "2026-01-01"
    changes: "Initial."
description: >
  Scenario H-3. Plan stage table marks stage 1 with HITL=Yes. The first
  agent (test-writer-tdd) already completed. The orchestrator must dispatch
  the second agent in the same stage (tests-review-tdd) also with
  human_in_the_loop: true — stage HITL applies to ALL agents, not just
  the first.

layer: orchestrator
negative: false

subject:
  identity: orchestrator
  agent: orchestrator
  workflows: [brownfield-tdd]
  infrastructure_agents: []
  opening_message: |
    Continue the existing workflow run. Read the Orchestration.md in the
    run-scoped folder and resume from where it left off. Do not ask me any
    further questions - proceed immediately and autonomously.
  invocation_kind: orchestrator
  allowed_tools: [Read, Write, Edit, Bash, Glob, Grep, Task]

stub_registry: hitl-plan-stage-all-agents.stubs.json

timeout: 10m
turn_limit: 5
stop_after_invocations: 1

seed_files:
  - path: Orchestration-{run_id}/Orchestration.md
    ref: execution-stage1-test-writer-done.md
  - path: Orchestration-{run_id}/Research.md
    ref: Research.md
  - path: Orchestration-{run_id}/Requirements.md
    ref: Requirements.md
  - path: Orchestration-{run_id}/Plan.md
    ref: Plan-hitl-stage1.md
  - path: Orchestration-{run_id}/Stage-1/Plan.md
    ref: Stage-1-Plan.md
  - path: Orchestration-{run_id}/Stage-1/PlanProgress.md
    ref: Stage-1-PlanProgress.md
  - path: Orchestration-{run_id}/Stage-2/Plan.md
    ref: Stage-2-Plan.md
  - path: Orchestration-{run_id}/Stage-2/PlanProgress.md
    ref: Stage-2-PlanProgress.md
  - path: Orchestration-{run_id}/ContractsDesign.md
    ref: ContractsDesign.md
  - path: Orchestration-{run_id}/plan-review.md
    ref: plan-review.md
  - path: Orchestration-{run_id}/contracts-review.md
    ref: contracts-review.md
  - path: Orchestration-{run_id}/requirements-review.md
    ref: requirements-review.md

assertions:
  invocation_sequence:
    exact: true
    steps:
      - { tool: dispatch, agent: tests-review-tdd }

  task_messages:
    # Dispatch 1: tests-review-tdd with HITL=true (plan stage applies to ALL agents)
    - at: 1
      identity: { tool: dispatch, agent: tests-review-tdd }
      human_in_the_loop: true
      required_input_artifacts:
        - Orchestration-{run_id}/Stage-1/Plan.md
        - Orchestration-{run_id}/ContractsDesign.md
      optional_input_artifacts:
        - Orchestration-{run_id}/Stage-1/PlanProgress.md
