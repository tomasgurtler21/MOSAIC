schema_version: 1
id: one-dispatch
description: >
  Smallest possible real-harness test: a purpose-built minimal orchestrator
  dispatches exactly one collaborator, which is answered by a stub. Asserts
  nothing about MOSAIC workflow semantics on purpose — its only job is to
  prove the tool's own plumbing (sandbox, provisioning, hook registration,
  interception, correlation, evidence capture, evaluation) works against a
  live harness.

layer: orchestrator
negative: false

subject:
  identity: mini-orchestrator
  definition: .claude/agents/mini-orchestrator.md
  opening_message: |
    Research the topic "widgets".
  invocation_kind: orchestrator
  model: default
  allowed_tools: [Task, Agent]

stub_registry: one-dispatch.stubs.json
timeout: 5m
turn_limit: 10

seed_files:
  - path: .claude/agents/mini-orchestrator.md
    ref: mini-orchestrator.md

assertions:
  invocation_sequence:
    exact: true
    steps:
      - { tool: Agent, agent: researcher }
