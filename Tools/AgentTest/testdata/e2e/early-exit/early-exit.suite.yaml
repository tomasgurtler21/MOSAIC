schema_version: 1
id: early-exit-e2e
description: >
  End-to-end disposition scenario (T18.6): a single-decision test whose
  early-exit threshold is reached mid-run. The run must stop on the
  early-exit sentinel and end normally rather than as a fault.
defaults:
  harness: fake
  timeout: 30s
  turn_limit: 5
  repetitions: 1
  pass_rate: 1.0
tests:
  - path: single-decision.test.yaml
