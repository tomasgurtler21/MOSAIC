schema_version: 1
id: protocol-violations-pass
description: >
  The helper's response uses an invented status code, so the true violation count (1) is what is declared.
layer: subagent
negative: false

subject:
  identity: standin-subject
  agent: standin-subject
  infrastructure_agents: []
  opening_message: |
    Greet the collaborator, then have the helper assist without creating files.
  invocation_kind: subagent
  allowed_tools: [Task]

stub_registry: protocol-violations-pass.stubs.json
stub_agents:
  - identity:
      tool: dispatch
      agent: greeter
    source: ../stub-agent-placeholder.md
  - identity:
      tool: dispatch
      agent: helper
    source: ../stub-agent-placeholder.md
timeout: 30s
turn_limit: 5

assertions:
  protocol_violations: 1
