schema_version: 1
id: final-state-last-status-fail
description: >
  The seeded orchestration document's last_status is SUCCESS, not the declared FAILURE, so final_state.last_status must fail by name. Phase is left undeclared so this test isolates last_status as the only evaluated subfield.
layer: subagent
negative: false

subject:
  identity: standin-subject
  agent: standin-subject
  opening_message: |
    Greet the collaborator, then have the helper assist without creating files.
  invocation_kind: subagent
  model: default
  allowed_tools: [Task]

stub_registry: final-state-last-status-fail.stubs.json
stub_agents:
  - identity:
      tool: dispatch
      agent: greeter
    source: ../stub-agent-placeholder.md
  - identity:
      tool: dispatch
      agent: helper
    source: ../stub-agent-placeholder.md
timeout: 30s
turn_limit: 5

seed_files:
  - path: Orchestration-{run_id}/Orchestration.md
    ref: orchestration.md

assertions:
  final_state:
    last_status: FAILURE
