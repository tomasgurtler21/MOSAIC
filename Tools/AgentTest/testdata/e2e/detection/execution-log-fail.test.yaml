schema_version: 1
id: execution-log-fail
description: >
  The declared agent ids name a row that was never recorded, so execution_log.agent_ids must fail by name.
layer: subagent
negative: false

subject:
  identity: standin-subject
  definition: subject.txt
  opening_message: |
    Greet the collaborator, then have the helper assist without creating files.
  invocation_kind: subagent
  model: default
  allowed_tools: [Task]

stub_registry: execution-log-fail.stubs.json
timeout: 30s
turn_limit: 5

seed_files:
  - path: Orchestration-{run_id}/Orchestration.md
    ref: orchestration.md

assertions:
  execution_log:
    agent_ids: ["greeter#1", "nonexistent#9"]
