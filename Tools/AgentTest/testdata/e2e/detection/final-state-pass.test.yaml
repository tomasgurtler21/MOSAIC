schema_version: 1
name: final-state-pass
id: 22
version: 1
changelog:
  - version: 1
    date: "2026-01-01"
    changes: "Initial."
description: >
  The seeded orchestration document's phase and last_status match what is declared.
layer: subagent
negative: false

subject:
  identity: standin-subject
  agent: standin-subject
  infrastructure_agents: []
  opening_message: |
    Greet the collaborator, then have the helper assist without creating files.
  invocation_kind: subagent
  allowed_tools: [Task]

stub_registry: final-state-pass.stubs.json
stub_agents:
  - identity:
      tool: dispatch
      agent: greeter
    source: ../stub-agent-placeholder.md
  - identity:
      tool: dispatch
      agent: helper
    source: ../stub-agent-placeholder.md
timeout: 30s
turn_limit: 5

seed_files:
  - path: Orchestration-{run_id}/Orchestration.md
    ref: orchestration.md

assertions:
  final_state:
    phase: EXECUTION
    last_status: SUCCESS
