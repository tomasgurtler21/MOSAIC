schema_version: 1
id: artifact-not-created-fail
description: >
  greeting.txt really is created, so asserting its absence must fail by name.
layer: subagent
negative: false

subject:
  identity: standin-subject
  definition: subject.txt
  opening_message: |
    Greet the collaborator, then have the helper assist without creating files.
  invocation_kind: subagent
  model: default
  allowed_tools: [Task]

stub_registry: artifact-not-created-fail.stubs.json
timeout: 30s
turn_limit: 5

assertions:
  artifact_not_created:
    - greeting.txt
