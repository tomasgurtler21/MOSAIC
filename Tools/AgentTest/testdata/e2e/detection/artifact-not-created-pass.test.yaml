schema_version: 1
id: artifact-not-created-pass
description: >
  The helper never creates a file, so asserting its absence passes.
layer: subagent
negative: false

subject:
  identity: standin-subject
  definition: subject.txt
  opening_message: |
    Greet the collaborator, then have the helper assist without creating files.
  invocation_kind: subagent
  model: default
  allowed_tools: [Task]

stub_registry: artifact-not-created-pass.stubs.json
timeout: 30s
turn_limit: 5

assertions:
  artifact_not_created:
    - farewell.txt
