schema_version: 1
name: greet
id: 31
version: 1
changelog:
  - version: 1
    date: "2026-01-01"
    changes: "Initial."
description: >
  The scripted subject dispatches one collaborator, substituted directly by
  the scripted adapter; the collaborator's declared side effect must exist
  and the observed invocation sequence must match exactly.
layer: subagent
negative: false

subject:
  identity: standin-subject
  agent: standin-subject
  infrastructure_agents: []
  opening_message: |
    Greet the collaborator and finish.
  invocation_kind: subagent
  allowed_tools: [Task]

stub_registry: greet.stubs.json
stub_agents:
  - identity:
      tool: dispatch
      agent: greeter
    source: ../stub-agent-placeholder.md
timeout: 30s
turn_limit: 5

assertions:
  invocation_sequence:
    exact: true
    steps:
      - { tool: dispatch, agent: greeter }
  artifact_created:
    - greeting.txt
