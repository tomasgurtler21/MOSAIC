schema_version: 1
id: subagent-layer
description: >
  Declares layer: subagent against a run whose one collaborator response
  carries an invented status code (the true violation count is 1), with
  protocol_violations declared as 0 — wrong for a layer that applies
  validation, correct-by-suppression for the orchestrator layer.
layer: subagent
negative: false

subject:
  identity: standin-subject
  agent: standin-subject
  infrastructure_agents: []
  opening_message: |
    Dispatch the helper, then finish.
  invocation_kind: subagent
  allowed_tools: [Task]

stub_registry: subagent-layer.stubs.json
stub_agents:
  - identity:
      tool: dispatch
      agent: helper
    source: ../stub-agent-placeholder.md
timeout: 30s
turn_limit: 5

assertions:
  protocol_violations: 0
