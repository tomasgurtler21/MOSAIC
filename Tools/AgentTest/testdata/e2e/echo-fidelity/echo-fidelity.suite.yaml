schema_version: 1
id: echo-fidelity-e2e
description: >
  End-to-end echo-fidelity scenario: the scripted collaborator's reply,
  delivered on the rewrite-prompt path, is compared against what the stub
  declared. A mismatch excludes the run and triggers a retry; if the mismatch
  recurs on the retry, both runs are excluded and the suite reports
  InfrastructureFailure.
defaults:
  timeout: 30s
  turn_limit: 5
  repetitions: 1
  pass_rate: 1.0
tests:
  - path: echo-mismatch.test.yaml
