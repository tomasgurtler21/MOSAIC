schema_version: 1
name: underlying-passes
id: 38
version: 1
changelog:
  - version: 1
    date: "2026-01-01"
    changes: "Initial."
description: >
  A negative test declares an artifact that the stub's side effect really
  creates. The underlying artifact_created assertion holds, which a
  negative test must not accept, so the overall verdict must be a fail.
layer: subagent
negative: true

subject:
  identity: standin-subject
  agent: standin-subject
  infrastructure_agents: []
  opening_message: |
    Greet the collaborator and finish.
  invocation_kind: subagent
  allowed_tools: [Task]

stub_registry: underlying-passes.stubs.json
stub_agents:
  - identity:
      tool: dispatch
      agent: greeter
    source: ../stub-agent-placeholder.md
timeout: 30s
turn_limit: 5

assertions:
  artifact_created:
    - greeting.txt
