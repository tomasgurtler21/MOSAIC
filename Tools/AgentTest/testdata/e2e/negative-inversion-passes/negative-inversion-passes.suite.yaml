schema_version: 1
id: negative-inversion-passes-e2e
description: >
  End-to-end inversion scenario (T18.5): a negative test whose declared
  artifact really is created by the stub's side effect. The underlying
  artifact_created assertion holds, which a negative test must not accept,
  so the overall verdict must be a fail.
defaults:
  timeout: 30s
  turn_limit: 5
  repetitions: 1
  pass_rate: 1.0
tests:
  - path: underlying-passes.test.yaml
