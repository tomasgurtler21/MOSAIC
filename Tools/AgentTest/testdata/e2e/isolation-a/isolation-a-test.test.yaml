schema_version: 1
id: isolation-a-test
description: >
  This run's one collaborator creates artifact-a.txt and nothing else.
layer: subagent
negative: false

subject:
  identity: standin-subject
  agent: standin-subject
  infrastructure_agents: []
  opening_message: |
    Ask worker-a to do its one thing, then finish.
  invocation_kind: subagent
  allowed_tools: [Task]

stub_registry: isolation-a-test.stubs.json
stub_agents:
  - identity:
      tool: dispatch
      agent: worker-a
    source: ../stub-agent-placeholder.md
timeout: 30s
turn_limit: 5

assertions:
  artifact_created:
    - artifact-a.txt
  artifact_not_created:
    - artifact-b.txt
