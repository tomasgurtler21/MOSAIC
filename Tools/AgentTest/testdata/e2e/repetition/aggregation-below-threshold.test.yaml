schema_version: 1
id: aggregation-below-threshold
description: >
  The same fixed 1-of-2 mixed outcome as aggregation-meets-threshold, but
  this test declares a pass rate (1.0) the mixed outcome does not reach, so
  the aggregate verdict is a fail.
layer: subagent
negative: false
repetitions: 2
pass_rate: 1.0

subject:
  identity: standin-subject
  definition: subject.txt
  opening_message: |
    Ask the effecter to do its one thing, then finish.
  invocation_kind: subagent
  model: default
  allowed_tools: [Task]

stub_registry: aggregation-below-threshold.stubs.json
timeout: 30s
turn_limit: 5

assertions:
  artifact_created:
    - effect.txt
