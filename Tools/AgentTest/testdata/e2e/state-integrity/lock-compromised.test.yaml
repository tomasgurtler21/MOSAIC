schema_version: 1
id: lock-compromised
description: >
  The scripted subject dispatches one collaborator that would otherwise
  complete normally, but the sandbox's run-state lock is compromised before
  the first interception runs. The compromised lock must be reclaimed and
  reported as a state-integrity fault rather than as a silent success or an
  assertion failure.
layer: subagent
negative: false

subject:
  identity: standin-subject
  definition: subject.txt
  opening_message: |
    Greet the one collaborator.
  invocation_kind: subagent
  model: default
  allowed_tools: [Task]

stub_registry: lock-compromised.stubs.json
timeout: 30s
turn_limit: 5

assertions:
  artifact_created:
    - greeting.txt
