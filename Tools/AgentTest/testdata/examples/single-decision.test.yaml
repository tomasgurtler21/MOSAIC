schema_version: 1
id: single-decision
description: >
  Reference example of a single-decision subagent-layer test: it starts
  mid-workflow by seeding a pre-run file resolved via a $ref into the
  fixture root, instead of letting the subject build that file itself.
layer: subagent
negative: false

subject:
  identity: planner
  agent: planner
  opening_message: |
    Continue the workflow using the seeded orchestration state.
  invocation_kind: subagent
  model: default
  allowed_tools: [Read, Write]

stub_registry: single-decision.stubs.json
timeout: 5m
turn_limit: 10

seed_files:
  - path: Orchestration-{run_id}/Orchestration.md
    ref: orchestration-mid-workflow.md

assertions:
  final_state:
    phase: COMPLETED
    last_status: SUCCESS
