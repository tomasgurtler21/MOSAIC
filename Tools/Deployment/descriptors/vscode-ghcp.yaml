schema_version: "1"
id: "vscode-ghcp"
display_name: "VS Code GitHub Copilot"
transform_version: "3.0.0"
injections_version: "1.3.0"

models:
  ids:
    - "Claude Opus 4.6"
    - "Claude Sonnet 4.6"
    - "Claude Haiku 4.6"
    - "GPT-5"
    - "GPT-5 mini"
  format_hint: "display-name"

tools:
  shape: list
  universe:
    - name: "read/readFile"
      unused: deny
      by_convention: false
    - name: "edit/createFile"
      unused: deny
      by_convention: false
    - name: "edit/createDirectory"
      unused: deny
      by_convention: false
    - name: "edit/editFiles"
      unused: deny
      by_convention: false
    - name: "search/fileSearch"
      unused: deny
      by_convention: false
    - name: "search/textSearch"
      unused: deny
      by_convention: false
    - name: "agent"
      unused: deny
      by_convention: false
    - name: "search/listDirectory"
      unused: deny
      by_convention: true
    - name: "execute/runInTerminal"
      unused: deny
      by_convention: false
    - name: "vscode/askQuestions"
      unused: deny
      by_convention: false
  mappings:
    - generic: "file_read"
      harness_tools:
        - "read/readFile"
    - generic: "file_write"
      harness_tools:
        - "edit/createFile"
        - "edit/editFiles"
    - generic: "file_edit"
      harness_tools:
        - "edit/editFiles"
    - generic: "file_search"
      harness_tools:
        - "search/fileSearch"
    - generic: "content_search"
      harness_tools:
        - "search/textSearch"
    - generic: "terminal"
      harness_tools:
        - "execute/runInTerminal"
    - generic: "user_interaction"
      harness_tools:
        - "vscode/askQuestions"
    - generic: "subagent"
      harness_tools:
        - "agent"
    - generic: "skill"
      harness_tools: []
  placeholder_expansion:
    - "read/readFile"
    - "edit/createFile"
    - "edit/createDirectory"
    - "edit/editFiles"
    - "search/fileSearch"
    - "search/textSearch"
    - "search/listDirectory"
    - "execute/runInTerminal"
    - "agent"
    - "vscode/askQuestions"

paths:
  agents:
    supported: true
    project: ".github/agents"
  skills:
    supported: true
    project: ".github/skills"
  hooks:
    supported: true
    project: ".claude/hooks"

extensions:
  agent: ".md"

frontmatter:
  model_key: "model"
  tools_key: "tools"
  add:
    - key: "disable-model-invocation"
      value: false
  drop:
    - "recommended_tier"
    - "tier_rationale"
    - "required_skills"
  key_order:
    - "id"
    - "version"
    - "transform_version"
    - "injections_version"
    - "name"
    - "description"
    - "model"
    - "tools"
    - "disable-model-invocation"

injections:
  - name: "HarnessConstraints"
    content: |-
      When reading a file with the intent to read it fully, **never assume the file is complete just because the last returned line is blank or ends a section.** Always verify you have reached the true end:
      - After reading a chunk, check if you received fewer lines than you requested — that signals the actual end of file
      - If you received as many lines as requested, the file likely continues — issue another read starting from where the last one ended
      - Keep paginating until you receive a short (or empty) response
      - **Exception:** If you are intentionally reading a specific range (e.g., to find a particular function or section), you do not need to read the rest of the file
  - name: "CustomConstraints"
    content: "**Parallel Tool Calls:** Issue multiple independent tool calls in a single response whenever possible. Sequential tool calls are only permitted when a later call depends on the result of an earlier one. This minimises inference API calls to improve speed and reduce cost."
  - name: "LanguagePatterns"
    content: ""

hooks:
  supported: true
  variant_key: "vscode-ghcp"
