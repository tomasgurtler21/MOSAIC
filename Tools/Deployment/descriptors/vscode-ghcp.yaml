schema_version: "1"
id: "vscode-ghcp"
display_name: "VS Code GitHub Copilot"
transform_version: "3.0.0"
injections_version: "1.3.0"

models:
  ids:
    - "Claude Sonnet 4.6"
    - "Claude Sonnet 4.5"
    - "Claude Opus 4.6"
    - "Claude Opus 4.7"
    - "Claude Opus 4.8"
    - "Claude Opus 4.8 Fast"
    - "Claude Opus 5"
    - "Claude Haiku 4.5"
    - "Claude Fable 5"
    - "Gpt 5.4"
    - "Gpt 5.4 Mini"
    - "Gpt 5.4 Nano"
    - "Gpt 5.3 Codex"
    - "Gpt 5.2 Codex"
    - "Gpt 4.1"
    - "Gemini 3.5 Flash"
    - "Gemini 3.6 Flash"
    - "Kimi K2.7 Code"
    - "Gpt 5.6 Sol"
    - "Gpt 5.6 Terra"
    - "Gpt 5.6 Luna"
    - "Mai Code 1 Flash"
  format_hint: "display-name"

tools:
  shape: list
  universe:
    - name: "read/readFile"
      unused: deny
      by_convention: false
    - name: "edit/createFile"
      unused: deny
      by_convention: false
    - name: "edit/createDirectory"
      unused: deny
      by_convention: false
    - name: "edit/editFiles"
      unused: deny
      by_convention: false
    - name: "search/fileSearch"
      unused: deny
      by_convention: false
    - name: "search/textSearch"
      unused: deny
      by_convention: false
    - name: "agent"
      unused: deny
      by_convention: false
    - name: "search/listDirectory"
      unused: deny
      by_convention: true
    - name: "execute/runInTerminal"
      unused: deny
      by_convention: false
    - name: "vscode/askQuestions"
      unused: deny
      by_convention: false
  mappings:
    - generic: "file_read"
      harness_tools:
        - "read/readFile"
    - generic: "file_write"
      harness_tools:
        - "edit/createFile"
        - "edit/editFiles"
    - generic: "file_edit"
      harness_tools:
        - "edit/editFiles"
    - generic: "file_search"
      harness_tools:
        - "search/fileSearch"
    - generic: "content_search"
      harness_tools:
        - "search/textSearch"
    - generic: "terminal"
      harness_tools:
        - "execute/runInTerminal"
    - generic: "user_interaction"
      harness_tools:
        - "vscode/askQuestions"
    - generic: "subagent"
      harness_tools:
        - "agent"
    - generic: "skill"
      harness_tools: []
  placeholder_expansion:
    - "read/readFile"
    - "edit/createFile"
    - "edit/createDirectory"
    - "edit/editFiles"
    - "search/fileSearch"
    - "search/textSearch"
    - "search/listDirectory"
    - "execute/runInTerminal"
    - "agent"
    - "vscode/askQuestions"

paths:
  agents:
    supported: true
    project: ".github/agents"
  skills:
    supported: true
    project: ".github/skills"
  hooks:
    supported: true
    project: ".claude/hooks"

extensions:
  agent: ".md"

frontmatter:
  model_key: "model"
  tools_key: "tools"
  add:
    - key: "disable-model-invocation"
      value: false
  drop:
    - "recommended_tier"
    - "tier_rationale"
    - "required_skills"
  key_order:
    - "id"
    - "version"
    - "transform_version"
    - "injections_version"
    - "name"
    - "description"
    - "model"
    - "tools"
    - "disable-model-invocation"

hooks:
  supported: true
  variant_key: "vscode-ghcp"
