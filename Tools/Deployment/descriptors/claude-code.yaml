schema_version: "1"
id: "claude-code"
display_name: "Claude Code"
transform_version: "3.0.0"
injections_version: "1.1.0"

models:
  ids:
    - "claude-opus-4-6"
    - "claude-sonnet-4-6"
    - "claude-haiku-4-5"
    - "claude-fable-5"
    - "claude-opus-5"
    - "claude-sonnet-5"
    - "claude-sonnet-4-5"
    - "claude-opus-4-8"
    - "claude-opus-4-7"
    - "claude-opus-4-6"

  format_hint: "claude-<model>-<version>"

tools:
  shape: list
  universe:
    - name: "Read"
      unused: deny
      by_convention: false
    - name: "Write"
      unused: deny
      by_convention: false
    - name: "Edit"
      unused: deny
      by_convention: false
    - name: "Bash"
      unused: deny
      by_convention: false
    - name: "Glob"
      unused: deny
      by_convention: false
    - name: "Grep"
      unused: deny
      by_convention: false
    - name: "Task"
      unused: deny
      by_convention: false
    - name: "AskUserQuestion"
      unused: deny
      by_convention: false
  mappings:
    - generic: "file_read"
      harness_tools:
        - "Read"
    - generic: "file_write"
      harness_tools:
        - "Write"
    - generic: "file_edit"
      harness_tools:
        - "Edit"
    - generic: "terminal"
      harness_tools:
        - "Bash"
    - generic: "file_search"
      harness_tools:
        - "Glob"
    - generic: "content_search"
      harness_tools:
        - "Grep"
    - generic: "subagent"
      harness_tools:
        - "Task"
        - "TaskStop"
    - generic: "user_interaction"
      harness_tools:
        - "AskUserQuestion"
    - generic: "skill"
      harness_tools: []
  placeholder_expansion:
    - "Read"
    - "Write"
    - "Edit"
    - "Bash"
    - "Glob"
    - "Grep"
    - "Task"
    - "AskUserQuestion"

paths:
  agents:
    supported: true
    project: ".claude/agents"
  skills:
    supported: true
    project: ".claude/skills"
  hooks:
    supported: true
    project: ".claude/hooks"

extensions:
  agent: ".md"

frontmatter:
  model_key: "model"
  tools_key: "tools"
  drop:
    - "recommended_tier"
    - "tier_rationale"
    - "required_skills"
  key_order:
    - "id"
    - "version"
    - "transform_version"
    - "injections_version"
    - "name"
    - "description"
    - "model"
    - "tools"

hooks:
  supported: true
  variant_key: "claude-code"
