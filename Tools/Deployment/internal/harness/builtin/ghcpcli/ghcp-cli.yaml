schema_version: "1"
id: "ghcp-cli"
display_name: "GitHub Copilot CLI"
transform_version: "3.0.0"
injections_version: "1.2.0"

models:
  ids:
    - "claude-sonnet-4.6"
    - "claude-sonnet-4.5"
    - "claude-opus-4.6"
    - "claude-opus-4.7"
    - "claude-opus-4.8"
    - "claude-opus-4.8-fast"
    - "claude-opus-5"
    - "claude-haiku-4-5"
    - "claude-fable-5"
    - "gpt-5.4"
    - "gpt-5.4-mini"
    - "gpt-5.4-nano"
    - "gpt-5.3-codex"
    - "gpt-5.2-codex"
    - "gpt-4.1"
    - "gemini-3.5-flash"
    - "gemini-3.6-flash"
    - "kimi-k2.7-code"
    - "gpt-5.6-sol"
    - "gpt-5.6-terra"
    - "gpt-5.6-luna"
    - "mai-code-1-flash"
  format_hint: "claude-<model>-<version> or gpt-<version>"

tools:
  shape: list
  universe:
    - name: "read"
      unused: deny
      by_convention: false
    - name: "edit"
      unused: deny
      by_convention: false
    - name: "search"
      unused: deny
      by_convention: false
    - name: "execute"
      unused: deny
      by_convention: false
    - name: "ask_user"
      unused: deny
      by_convention: false
    - name: "agent"
      unused: deny
      by_convention: false
    - name: "skill"
      unused: deny
      by_convention: false
  mappings:
    - generic: "file_read"
      destinations:
        - to: main
          names:
            - "read"
    - generic: "file_write"
      destinations:
        - to: main
          names:
            - "edit"
    - generic: "file_edit"
      destinations:
        - to: main
          names:
            - "edit"
    - generic: "file_search"
      destinations:
        - to: main
          names:
            - "search"
    - generic: "content_search"
      destinations:
        - to: main
          names:
            - "search"
    - generic: "terminal"
      destinations:
        - to: main
          names:
            - "execute"
    - generic: "user_interaction"
      destinations:
        - to: main
          names:
            - "ask_user"
    - generic: "subagent"
      destinations:
        - to: main
          names:
            - "agent"
    - generic: "skill"
      destinations:
        - to: main
          names:
            - "skill"
  placeholder_expansion:
    - "read"
    - "edit"
    - "search"
    - "execute"
    - "ask_user"
    - "agent"

paths:
  agents:
    supported: true
    project: ".github/agents"
  skills:
    supported: true
    project: ".github/skills"
  hooks:
    supported: true
    project: ".github/hooks"

extensions:
  agent: ".agent.md"

frontmatter:
  model_key: "model"
  tools_key: "tools"
  add:
    - key: "user-invocable"
      value: false
  drop:
    - "recommended_tier"
    - "tier_rationale"
    - "required_skills"
  key_order:
    - "mosaic_id"
    - "version"
    - "mosaic_transform_version"
    - "mosaic_injections_version"
    - "mosaic_orchestrator_injections_version"
    - "name"
    - "description"
    - "model"
    - "tools"
    - "user-invocable"

hooks:
  supported: true
  variant_key: "ghcp-cli"
