schema_version: "1"
id: "opencode"
display_name: "OpenCode"
transform_version: "3.0.0"
injections_version: "1.3.1"

models:
  ids:
    - "github-copilot/claude-opus-4.6"
    - "github-copilot/claude-sonnet-4-6"
    - "anthropic/claude-opus-4-20250514"
    - "anthropic/claude-sonnet-4-20250514"
  format_hint: "provider/model-id"

tools:
  shape: permission
  universe:
    - name: "read"
      unused: deny
      by_convention: false
    - name: "write"
      unused: deny
      by_convention: false
    - name: "edit"
      unused: deny
      by_convention: false
    - name: "glob"
      unused: deny
      by_convention: false
    - name: "grep"
      unused: deny
      by_convention: false
    - name: "list"
      unused: deny
      by_convention: true
    - name: "bash"
      unused: deny
      by_convention: false
    - name: "patch"
      unused: deny
      by_convention: false
    - name: "webfetch"
      unused: deny
      by_convention: false
    - name: "question"
      unused: deny
      by_convention: false
    - name: "lsp"
      unused: deny
      by_convention: false
    - name: "task"
      unused: deny
      by_convention: false
    - name: "todowrite"
      unused: deny
      by_convention: false
    - name: "todoread"
      unused: deny
      by_convention: false
    - name: "skill"
      unused: deny
      by_convention: false
  mappings:
    - generic: "file_read"
      destinations:
        - to: main
          names:
            - "read"
    - generic: "file_write"
      destinations:
        - to: main
          names:
            - "write"
    - generic: "file_edit"
      destinations:
        - to: main
          names:
            - "edit"
    - generic: "file_search"
      destinations:
        - to: main
          names:
            - "glob"
    - generic: "content_search"
      destinations:
        - to: main
          names:
            - "grep"
    - generic: "terminal"
      destinations:
        - to: main
          names:
            - "bash"
    - generic: "user_interaction"
      destinations:
        - to: main
          names:
            - "question"
    - generic: "subagent"
      destinations:
        - to: main
          names:
            - "task"
    - generic: "skill"
      destinations:
        - to: main
          names:
            - "skill"
  placeholder_expansion:
    - "read"
    - "write"
    - "edit"
    - "glob"
    - "grep"
    - "bash"
    - "question"
    - "task"

paths:
  agents:
    supported: true
    project: ".opencode/agents"
  skills:
    supported: true
    project: ".opencode/skills"
  hooks:
    supported: true
    project: ".opencode/plugins"

extensions:
  agent: ".md"

frontmatter:
  model_key: "model"
  tools_key: "permission"
  drop:
    - "name"
    - "recommended_tier"
    - "tier_rationale"
    - "required_skills"
    - "tools"
  key_order:
    - "id"
    - "version"
    - "transform_version"
    - "injections_version"
    - "orchestrator_injections_version"
    - "description"
    - "mode"
    - "model"
    - "permission"

hooks:
  supported: true
  variant_key: "opencode"
