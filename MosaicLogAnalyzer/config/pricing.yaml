# MosaicLogAnalyzer pricing configuration
#
# This file controls how mosaic-log-analyzer prices token usage in your
# orchestration logs. Add one entry per model whose cost you want reported.
# Models with no entry will still have their token counts shown; their money
# columns will be labelled "unpriced" rather than $0.
#
# Location: MosaicLogAnalyzer/config/pricing.yaml (relative to the MOSAIC root)
# The tool reads this file at startup and never modifies it unless you use the
# interactive pricing-gap resolution flow, which appends or updates entries here.
#
# ---------------------------------------------------------------------------
# Schema
# ---------------------------------------------------------------------------
#
# models:
#   <model-id>:            # the model identifier exactly as it appears in logs
#     input: "<rate>"
#     cached_input: "<rate>"
#     cache_write: "<rate>"
#     output_under_threshold: "<rate>"
#     output_at_threshold: "<rate>"       # omit or set to null if no long-context tier
#     context_length_threshold: <tokens>  # omit or set to null if no long-context tier
#
# All rate values are decimal USD per 1,000,000 tokens, written as quoted
# strings with up to two decimal places (e.g. "3.00" or "0.30").
# Quoting is required so YAML does not silently truncate precision.
#
# context_length_threshold is the total-context size (input + cache read +
# cache creation tokens) at or above which the ENTIRE invocation's output is
# repriced at output_at_threshold. Absent or null means the model has no
# long-context tier and output_at_threshold is ignored.
#
# ---------------------------------------------------------------------------
# Example (all lines commented out — no active prices defined)
# ---------------------------------------------------------------------------
#
models:
  claude-opus-4-6:
    input: "5"
    cached_input: "0.5"
    cache_write: "6.25"
    output_under_threshold: "25"
  claude-opus-5:
    input: "5.00"
    cached_input: "0.5"
    cache_write: "6.25"
    output_under_threshold: "25.00"
  claude-sonnet-4-6:
    input: "3.00"
    cached_input: "0.30"
    cache_write: "3.75"
    output_under_threshold: "15.00"
  claude-sonnet-5:
    input: "2.00"
    cached_input: "0.20"
    cache_write: "2.50"
    output_under_threshold: "5.00"
